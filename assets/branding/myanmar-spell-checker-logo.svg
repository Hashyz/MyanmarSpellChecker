<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2E6B"/>
      <stop offset="52%" stop-color="#1656BA"/>
      <stop offset="100%" stop-color="#2274E0"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8EC0FF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#FFE082" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12964F"/>
      <stop offset="100%" stop-color="#22C56B"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-12%" width="128%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#061A40" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- Rounded Royal Sky-Sapphire App Tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  <rect x="34" y="34" width="444" height="444" rx="98" ry="98" fill="none" stroke="url(#rimGrad)" stroke-width="5"/>

  <!-- Subtle Inner Shield Crest -->
  <path d="M256 60 L418 110 V256 C418 350 348 420 256 448 C164 420 94 350 94 256 V110 Z"
        fill="#FFFFFF" fill-opacity="0.07" stroke="#CBE1FF" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Open Thatpon Book Pages Accent -->
  <path d="M128 364 Q192 340 256 368 Q320 340 384 364 L384 390 Q320 366 256 394 Q192 366 128 390 Z"
        fill="#FFE082" fill-opacity="0.92"/>
  <path d="M140 350 Q198 328 256 354 Q314 328 372 350 L372 366 Q314 344 256 370 Q198 344 140 366 Z"
        fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Bold Myanmar "မိုး" (Moe — Tribute to U Moe Kyaw Thu) Centerpiece -->
  <text x="252" y="226" text-anchor="middle" dominant-baseline="central"
        font-family="'Pyidaungsu','Myanmar Text','Padauk',sans-serif"
        font-size="152" font-weight="700" fill="#FFFFFF"
        style="filter: drop-shadow(0px 6px 6px rgba(4,18,48,0.32));">မိုး</text>

  <!-- Emerald Verification Checkmark Badge -->
  <circle cx="390" cy="390" r="82" fill="#0B2E6B"/>
  <circle cx="390" cy="390" r="74" fill="url(#checkGrad)" stroke="#FFFFFF" stroke-width="10"/>
  <path d="M354 391 L379 416 L430 363" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
