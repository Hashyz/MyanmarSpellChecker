name: CI Quality & Accuracy Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-benchmark:
    name: Build, xUnit Suite, 13-Tier Benchmark & Installer Validation
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build All 6 Projects (Zero Warnings / Zero Errors)
        shell: powershell
        run: dotnet build .\MyanmarSpellChecker.sln -c Release /warnaserror

      - name: Run Full xUnit Regression & Architecture Suite
        shell: powershell
        run: dotnet test .\tests\MyanmarSpellChecker.Core.Tests\MyanmarSpellChecker.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Run 13-Tier Progressive Accuracy & Speed Benchmark
        shell: powershell
        run: .\src\MyanmarSpellChecker.AdminTools\bin\Release\net48\MyanmarSpellChecker.AdminTools.exe benchmark

      - name: Validate 1-Click Installer Package Resolution
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -STA -File .\installer\Easy-Setup.ps1 -ValidateOnly -Silent
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\src\MyanmarSpellChecker.Setup\bin\Release\net48\MyanmarSpellChecker-Setup.exe --validate
