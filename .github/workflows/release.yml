name: Release Unified Office Suite

on:
  push:
    branches:
      - main
    paths:
      - 'Directory.Build.props'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-release:
    name: Build Signed Single-File Setup.exe, EasySetup.zip & Update Manifest
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve Release Version & Tag
        id: ver
        shell: powershell
        run: |
          [xml]$props = Get-Content .\Directory.Build.props -Raw
          $fv = $props.Project.PropertyGroup.FileVersion.Trim()
          $parts = $fv.Split('.')
          $shortTag = if ($parts.Length -ge 4 -and $parts[3] -ne '0') { "v$fv" } else { "v$($parts[0]).$($parts[1]).$($parts[2])" }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
              $shortTag = $env:GITHUB_REF -replace '^refs/tags/', ''
          }
          "file_version=$fv" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag_name=$shortTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved FileVersion=$fv, TagName=$shortTag"

      - name: Build Signed Release Package, Single-File Setup.exe & User Guides
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\installer\Build-EnterpriseRelease.ps1

      - name: Validate Single-File Setup.exe & Post-Package Architecture Gates
        shell: powershell
        run: |
          $valOut = .\artifacts\MyanmarSpellChecker-Setup.exe --validate | Out-String
          Write-Host $valOut
          if ($LASTEXITCODE -ne 0 -or $valOut -notmatch 'SETUP_VALIDATE_OK') { exit 1 }
          dotnet test .\tests\MyanmarSpellChecker.Core.Tests\MyanmarSpellChecker.Core.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~V46_CleanMachine|FullyQualifiedName~V77_|FullyQualifiedName~V84_"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyanmarSpellChecker-Release-${{ steps.ver.outputs.tag_name }}
          path: |
            artifacts/MyanmarSpellChecker-Setup.exe
            artifacts/MyanmarSpellChecker-EasySetup-OfficeSuite.zip
            artifacts/mlc_thatpon.db
            artifacts/update-manifest.json
            docs/Myanmar-Spell-Checker-User-Guide.html
            docs/Myanmar-Spell-Checker-User-Guide.docx

      - name: Publish GitHub Release (Setup.exe + EasySetup.zip + Manifest + Dictionary)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag_name }}
          name: "Myanmar Official Spell Checker Suite ${{ steps.ver.outputs.tag_name }} (Word + Excel + PowerPoint)"
          files: |
            artifacts/MyanmarSpellChecker-Setup.exe
            artifacts/MyanmarSpellChecker-EasySetup-OfficeSuite.zip
            artifacts/mlc_thatpon.db
            artifacts/update-manifest.json
            docs/Myanmar-Spell-Checker-User-Guide.html
            docs/Myanmar-Spell-Checker-User-Guide.docx
          generate_release_notes: true
