name: Release Unified Office Suite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-release:
    name: Build Signed Word + Excel + PowerPoint Release Bundle
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Signed Release Package & User Guides
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\installer\Build-EnterpriseRelease.ps1

      - name: Run Post-Package Clean-Machine & Architecture Gates
        shell: powershell
        run: dotnet test .\tests\MyanmarSpellChecker.Core.Tests\MyanmarSpellChecker.Core.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~V46_CleanMachine|FullyQualifiedName~V77_"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyanmarSpellChecker-EasySetup-OfficeSuite
          path: |
            artifacts/MyanmarSpellChecker-EasySetup-OfficeSuite.zip
            docs/Myanmar-Spell-Checker-User-Guide.html
            docs/Myanmar-Spell-Checker-User-Guide.docx

      - name: Publish GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MyanmarSpellChecker-EasySetup-OfficeSuite.zip
            docs/Myanmar-Spell-Checker-User-Guide.html
            docs/Myanmar-Spell-Checker-User-Guide.docx
          generate_release_notes: true
